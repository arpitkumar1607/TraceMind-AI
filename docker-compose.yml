services:
  db:
    image: postgres:16-alpine
    container_name: tracemind-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracemind}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tracemind123}
      POSTGRES_DB: ${POSTGRES_DB:-tracemind_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracemind} -d ${POSTGRES_DB:-tracemind_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tracemind-backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-tracemind}:${POSTGRES_PASSWORD:-tracemind123}@db:5432/${POSTGRES_DB:-tracemind_db}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GROQ_MODEL=${GROQ_MODEL:-llama-3.3-70b-versatile}
      - DEBUG=True
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tracemind-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
